<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local HTML Browser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #nav-bar {
            display: flex;
            padding: 10px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
            gap: 10px;
        }
        #address-bar {
            flex-grow: 1;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #browser-frame {
            flex-grow: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="#nav-bar">
        <input type="text" id="address-bar" placeholder="Enter URL (e.g., https://example.com) or local file path..." />
        <button onclick="navigateToUrl()">Go</button>
    </div>

    <iframe id="browser-frame" src="about:blank"></iframe>

    <script>
        function navigateToUrl() {
            const urlInput = document.getElementById('address-bar').value;
            const iframe = document.getElementById('browser-frame');
            
            // Basic URL formatting check
            if (urlInput.startsWith('http://') || urlInput.startsWith('https://') || urlInput.startsWith('file://')) {
                iframe.src = '/proxy?url=' + urlInput;
            } else {
                // Default to HTTP if no protocol is given
                iframe.src = '/proxy?url=https://' + urlInput;
            }
        }

        // Allow pressing "Enter" to navigate
        document.getElementById('address-bar').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigateToUrl();
            }
        });
    </script>

</body>
</html>
