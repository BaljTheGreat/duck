<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local HTML Browser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #nav-bar {
            display: flex;
            padding: 10px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
            gap: 10px;
        }
        #address-bar {
            flex-grow: 1;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #browser-frame {
            flex-grow: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="nav-bar">
        <input type="text" id="address-bar" placeholder="Enter a URL (e.g. https://example.com)" />
        <button type="button" id="go-button">Go</button>
    </div>

    <iframe id="browser-frame" src="about:blank" title="Browser content"></iframe>

    <script>
        const addressBar = document.getElementById('address-bar');
        const browserFrame = document.getElementById('browser-frame');

        function navigateToUrl() {
            const value = addressBar.value.trim();
            if (!value) return;

            let url = value;
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            try {
                url = new URL(url).href;
                browserFrame.src = '/proxy?url=' + encodeURIComponent(url);
            } catch (error) {
                alert('Please enter a valid URL.');
            }
        }

        document.getElementById('go-button').addEventListener('click', navigateToUrl);
        addressBar.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') navigateToUrl();
        });
    </script>
</body>
</html>
